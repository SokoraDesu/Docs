site_name: Sokora
site_url: https://sokora.org/
repo_url: https://github.com/SokoraDesu/Sokora
repo_name: sokoradesu/sokora
site_description: Documentation for Sokora, the beautifully crafted Discord bot that’s easy, powerful, and open-source.
site_author: The Sokora team

copyright: Copyright &copy; Subete

theme:
  name: material
  language: en
  favicon: /favicon.png
  logo: /icon.png
  palette:
    - scheme: default
      primary: purple
      accent: purple
  features:
    - content.footnote.tooltips
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - glightbox:
      enabled: true
  - minify
  - social:
      cards_layout: default/variant
  - llmstxt:
      markdown_description: Sokora is a beautifully-crafted, multipurpose, free and open source Discord bot with various easy to use yet powerful features.
      sections:
        User-facing docs:
        - users/*.md
        Developer facing docs:
          - interkora/index.md: API docs
          - dev/*.md: Contributor guides

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sokoradesu/sokora

markdown_extensions:
  - abbr
  - footnotes
  - admonition
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.superfences:
       custom_fences:
         - name: mermaid
           class: mermaid
           format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - User guide:
      - Welcome to the user guide: users/index.md
      - Settings:
        - The in-bot settings panel: users/pse.md
      - Moderation:
        - Cases: users/mod/cases.md
        - What you can do: users/mod/modtypes.md
      - Writing:
        - Dynamic variables: users/variables.md
  - Migrate your leveling bot: import.md
  - Interkora:
      - Welcome to Interkora: interkora/index.md
      - How it works:
          - How it works: interkora/how/index.md
          - Get: interkora/how/get.md
          - Set: interkora/how/set.md
          - Query: interkora/how/query.md
          - Moderate: interkora/how/mod.md
          # - Get to the source: interkora/how/source.md
      - Reference: interkora/reference.md
  - Developer guide:
      - Welcome, contributor!: dev/index.md
      - First steps: dev/101.md
      - The codebase:
        - Overall structure: dev/structure.md
        - Feature: dev/features.md
        - Settings: dev/settings.md
        - Testing: dev/testing.md
      - Guidelines:
        - Developer manual: dev/contributing.md
        - Code quality: dev/ql.md
        - Commit system: dev/subecommits.md
